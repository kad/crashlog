[DEFAULT]
# Upstream and the packaging share a branch: debian/ lives in the upstream repository, and is kept
# out of the tarballs through .gitattributes. There is therefore no upstream branch to import onto,
# and no pristine-tar branch: both tarballs are produced by packaging/create-tarballs.sh.
debian-branch = main
upstream-branch = main
upstream-tag = v%(version)s
pristine-tar = False

# The vendored Rust dependencies are an additional component of the upstream tarball, which
# dpkg-source unpacks into vendor/.
component = ['vendor']
